<svg xmlns="http://www.w3.org/2000/svg" width="320" height="88" viewBox="0 0 320 88" role="img" aria-label="WhisperFlow animated logo">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FB0FF"/>
      <stop offset="1" stop-color="#2952E3"/>
    </linearGradient>
  </defs>
  <rect x="6" y="20" width="5" height="48" rx="2.5" fill="url(#wg)">
    <animate attributeName="height" values="48;20;48" dur="1.2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="y" values="20;34;20" dur="1.2s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="17" y="8" width="5" height="72" rx="2.5" fill="url(#wg)">
    <animate attributeName="height" values="72;30;72" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="y" values="8;29;8" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
  </rect>
  <rect x="28" y="0" width="5" height="88" rx="2.5" fill="url(#wg)">
    <animate attributeName="height" values="88;40;88" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="y" values="0;24;0" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <rect x="39" y="10" width="5" height="68" rx="2.5" fill="url(#wg)">
    <animate attributeName="height" values="68;28;68" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
    <animate attributeName="y" values="10;30;10" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
  </rect>
  <rect x="50" y="22" width="5" height="44" rx="2.5" fill="url(#wg)">
    <animate attributeName="height" values="44;18;44" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="y" values="22;35;22" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <text x="70" y="58" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="40" fill="#E9E8E1">WhisperFlow</text>
</svg>
