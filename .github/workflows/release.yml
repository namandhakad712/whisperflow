name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Windows installer + auto-update feed
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # electron-vite needs the workspace packages' dist/ to resolve them
      - run: npm run build -w packages/shared
      - run: npm run build -w packages/engine
      # electron-builder packs out/ — build the app first (same as the CI job)
      - run: npm run build -w apps/desktop

      - name: Build + publish installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      # latest.yml + blockmap are the auto-update feed; make sure they are
      # attached to the release even if electron-builder's attach step raced.
      - name: Attach update feed files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
