name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Windows installer + auto-update feed
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # electron-vite needs the workspace packages' dist/ to resolve them
      - run: npm run build -w packages/shared
      - run: npm run build -w packages/engine
      # electron-builder packs out/ — build the app first (same as the CI job)
      - run: npm run build -w apps/desktop

      # Two-phase build: electron-builder writes resources/app-update.yml (the
      # config electron-updater needs for its download cache dir) only when it
      # PUBLISHES, and this workflow uploads assets itself — so we build
      # unpacked, inject the provider config, then pack the installer from it.
      - name: Build (unpackaged)
        working-directory: apps/desktop
        run: npx electron-builder --win dir --publish never

      - name: Inject update provider config
        shell: pwsh
        run: |
          $yml = @"
          provider: github
          owner: namandhakad712
          repo: whisperflow
          channel: latest
          "@
          $yml | Out-File -FilePath apps/desktop/release/win-unpacked/resources/app-update.yml -Encoding utf8NoBOM

      - name: Pack installer
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never

      # The release: installer + latest.yml + blockmap. latest.yml + blockmap are
      # the auto-update feed — blockmap is what makes electron-updater download
      # only the changed blocks between versions.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} # the tag already carries the leading "v"
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/WhisperFlow-Setup-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
